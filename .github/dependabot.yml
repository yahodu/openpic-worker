# Dependabot — keeps the dependency surfaces of this repo moving.
#
# Two things learned from the first live run:
#
# 1. `commit-message.prefix` + `include: "scope"` composes as
#    `<prefix>(<scope>): …`, so a prefix of "build(deps)" produced
#    `build(deps)(deps): bump …`. Set the plain type and let the scope supply
#    the "deps": prefix "build" -> `build(deps): …`.
# 2. An ecosystem with no manifest is a *scheduled error*, not a no-op: pip
#    reported "No files found in /" and docker "No Dockerfiles nor Kubernetes
#    YAML found in /" on every run. Those blocks are commented out until the
#    worker reimplementation lands. Uncomment when pyproject.toml / uv.lock and
#    the Dockerfile exist — Dependabot does not re-add an ecosystem by itself.
#
# `pr-checks.yml` exempts `dependabot[bot]` from the branch-name and ticket
# rules; its PR titles still satisfy the conventional-commit pattern.
version: 2
updates:
  # Python runtime + dev dependencies (uv lockfile lives at the repo root).
  #
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #     time: "05:00"
  #     timezone: "Etc/UTC"
  #   open-pull-requests-limit: 5
  #   labels:
  #     - "dependencies"
  #     - "python"
  #   commit-message:
  #     prefix: "build"
  #     include: "scope"
  #   groups:
  #     # Patch/minor bumps arrive as one PR to keep the review queue short;
  #     # majors stay individual because each one needs a real read.
  #     python-minor-patch:
  #       patterns: ["*"]
  #       update-types: ["minor", "patch"]
  #   ignore:
  #     # CUDA-linked wheels must match the host driver, so a bot-chosen torch
  #     # version is a broken GPU host waiting to happen. Bump deliberately.
  #     - dependency-name: "torch"
  #       update-types: ["version-update:semver-major", "version-update:semver-minor"]
  #     - dependency-name: "nvidia-*"

  # The workflow files themselves hold production credentials.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      # -> "ci(deps): bump the actions group with N updates"
      prefix: "ci"
      include: "scope"
    groups:
      # Patch/minor only. An action major can change inputs or the Node
      # runtime under a workflow that holds production credentials, so it
      # must not ride along in a grouped PR (the first run bundled
      # codeql-action v3 -> v4 that way). Majors arrive individually.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base image bumps (CUDA runtime, python-slim, etc.).
  #
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #     time: "05:00"
  #     timezone: "Etc/UTC"
  #   labels:
  #     - "dependencies"
  #     - "docker"
  #   commit-message:
  #     prefix: "build"
  #     include: "scope"
