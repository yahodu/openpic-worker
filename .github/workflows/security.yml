# Supply-chain security checks that are not part of the functional CI gate.
#
# Two independent jobs:
#   * dependency-review — runs on PRs only, blocks a PR that introduces a
#     vulnerable or licence-incompatible dependency, and explains why in the
#     PR. This is the cheapest place to stop a bad dependency: before it is
#     ever merged, instead of after an advisory fires on main.
#   * scorecard — OpenSSF Scorecard, weekly and on branch-protection changes.
#     Public repo, so results publish to the public Scorecard API; it is the
#     standing audit of *this pipeline's* own hygiene (pinned actions, token
#     permissions, branch protection, dangerous workflow patterns).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for the inline summary comment on the PR.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block high/critical advisories. Moderates surface as a warning in
          # the summary rather than failing the PR — the runtime audit in CI
          # (pip-audit) is the strict gate, and it re-checks the resolved tree.
          fail-on-severity: high
          # Only the values that the worker actually ships are worth blocking
          # a merge over; dev-only tooling is covered by the non-blocking audit.
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure
          # A GPU worker ships to hosts we do not control, so copyleft is a
          # deliberate policy decision, not an accident. Extend this list when a
          # legitimately-needed package trips it.
          license-check: true
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            BSL-1.0,
            CC0-1.0,
            ISC,
            MIT,
            MPL-2.0,
            PSF-2.0,
            Python-2.0,
            Unlicense,
            Zlib

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # publish_results needs an OIDC token; SARIF upload needs security-events.
      id-token: write
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to https://securityscorecards.dev — public repos only.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          sarif_file: results.sarif
